# f4commons behind an existing TLS server block: include this inside that server {} block.
# Only the MCP endpoint is proxied; the server listens on 127.0.0.1 and every request needs a member's bearer token.
location = /f4commons/mcp {
    limit_req zone=f4commons burst=60 nodelay;
    limit_req_status 429;
    client_max_body_size 256k;
    proxy_pass http://127.0.0.1:4410/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_read_timeout 300s;
}
location ^~ /f4commons/ {
    return 404;
}
